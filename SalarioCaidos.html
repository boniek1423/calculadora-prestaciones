<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Salarios Caídos - Reclamo Laboral</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 650px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #1a3a5a; text-align: center; margin-bottom: 10px; }
        .legal-note { color: #d9534f; font-size: 0.85em; text-align: center; font-weight: bold; margin-bottom: 20px; }
        
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .field { flex: 1; }
        
        label { display: block; margin-top: 10px; font-weight: 600; color: #444; font-size: 0.9em; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        input:focus { border-color: #27ae60; outline: none; box-shadow: 0 0 5px rgba(39, 174, 96, 0.2); }
        
        button { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 6px; margin-top: 25px; cursor: pointer; font-size: 17px; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #1e8449; }
        
        .result { margin-top: 30px; padding: 20px; background: #f8fff9; border: 1px solid #c3e6cb; border-radius: 8px; display: none; }
        .result h3 { margin-top: 0; color: #2d572c; border-bottom: 2px solid #c3e6cb; padding-bottom: 10px; }
        .item-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1.05em; }
        .grand-total { font-size: 1.4em; color: #1e8449; font-weight: 800; border-top: 2px solid #c3e6cb; padding-top: 10px; margin-top: 10px; }
        .info-tag { font-size: 0.85em; color: #666; font-style: italic; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cálculo de Salarios Caídos</h2>
    <div class="legal-note">* Basado en LOTTT Art. 92 y Art. 142</div>
    
    <div class="row">
        <div class="field">
            <label>Fecha de inicio del impago:</label>
            <input type="date" id="fechaInicio">
        </div>
        <div class="field">
            <label>Fecha de corte (hoy):</label>
            <input type="date" id="fechaFin">
        </div>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <div class="row">
        <div class="field">
            <label>Salario Diario Base ($):</label>
            <input type="number" id="salario" value="11" step="0.01">
        </div>
        <div class="field">
            <label>Cesta Ticket Mensual ($):</label>
            <input type="number" id="cestaticket" value="50">
        </div>
    </div>

    <label>Bono de Guerra Económica Mensual ($):</label>
    <input type="number" id="bonoguerra" value="90">

    <button onclick="calcularConFechas()">Generar Resumen de Deuda</button>

    <div id="resultado" class="result">
        <h3>Resumen Detallado</h3>
        <div class="item-row">
            <span>Días transcurridos:</span>
            <span id="resDias" style="font-weight: bold;"></span>
        </div>
        <div class="item-row">
            <span>Salarios Caídos:</span>
            <span id="resSalarios"></span>
        </div>
        <div class="item-row">
            <span>Cesta Ticket acumulado:</span>
            <span id="resCT"></span>
        </div>
        <div class="item-row">
            <span>Bonificación acumulada:</span>
            <span id="resBonos"></span>
        </div>
        <div class="grand-total">
            <span>TOTAL ADEUDADO:</span>
            <span id="granTotal"></span>
        </div>
        <div class="info-tag" id="infoFechas"></div>
    </div>
</div>

<script>
    // Establecer la fecha de hoy por defecto en el segundo campo
    document.getElementById('fechaFin').valueAsDate = new Date();

    function calcularConFechas() {
        const f1 = new Date(document.getElementById('fechaInicio').value);
        const f2 = new Date(document.getElementById('fechaFin').value);
        
        if (isNaN(f1.getTime()) || isNaN(f2.getTime())) {
            alert("Por favor, selecciona ambas fechas.");
            return;
        }

        if (f1 > f2) {
            alert("La fecha de inicio no puede ser mayor a la fecha de corte.");
            return;
        }

        // Diferencia en milisegundos y conversión a días
        const diffTime = Math.abs(f2 - f1);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; // +1 para incluir el día inicial
        const meses = diffDays / 30;

        const salarioDiario = parseFloat(document.getElementById('salario').value);
        const ctMensual = parseFloat(document.getElementById('cestaticket').value);
        const bonoMensual = parseFloat(document.getElementById('bonoguerra').value);

        // Cálculos Finales
        const totalSalarios = diffDays * salarioDiario;
        const totalCT = meses * ctMensual;
        const totalBonos = meses * bonoMensual;
        const granTotal = totalSalarios + totalCT + totalBonos;

        // Mostrar en el DOM
        document.getElementById('resDias').innerText = `${diffDays} días`;
        document.getElementById('resSalarios').innerText = `$${totalSalarios.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        document.getElementById('resCT').innerText = `$${totalCT.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        document.getElementById('resBonos').innerText = `$${totalBonos.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        document.getElementById('granTotal').innerText = `$${granTotal.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        
        document.getElementById('infoFechas').innerText = `* Cálculo basado en el periodo del ${f1.toLocaleDateString()} al ${f2.toLocaleDateString()}.`;
        
        document.getElementById('resultado').style.display = 'block';
    }
</script>

</body>
</html>
